label: "Fedora"
grub2:
  timeout: 10
  entries:
    - name: "Fedora"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Fedora enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Fedora (Basic Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Fedora enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
