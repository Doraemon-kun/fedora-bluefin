name: Build and Upload ISO

on:
  schedule:
    - cron: '15 13 26 * *' # 26th every month - 13:15 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: latest

jobs:
  build-iso:
    name: Build and upload ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prepare environment
        run: |
          # Get UID/GID to use for chown in the builder
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}
          # Lowercase registry strings for container compatibility
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Prepare iso.toml
        run: |
          # Replaces the placeholder in iso.toml
          IMAGE_URL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          sed -i "s|@@IMAGE_URL@@|${IMAGE_URL}|g" ./iso/iso.toml

      - name: Build ISO using bootc-image-builder
        id: build
        # We use the bootc-image-builder-action as requested
        uses: osbuild/bootc-image-builder-action@f579f3d302eaebc5a7a87bd29b98ee07b09a3e92 # main
        with:
          # Assuming you have an iso.toml based on standard ublue setups
          config-file: ./iso/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          # anaconda-iso generates the standard Fedora-style installer ISO
          types: anaconda-iso

      - name: Upload ISO to Cloudflare R2 (S3)
        shell: bash
        # Rclone dynamically creates an "R2" remote using these environment variables
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          SOURCE_DIR: ${{ steps.build.outputs['output-directory'] }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

          # We copy the generated output to the bucket specified in your secrets
          rclone copy "$SOURCE_DIR" "R2:$R2_BUCKET"
