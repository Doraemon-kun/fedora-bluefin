name: Build and Upload ISO

on:
  schedule:
    - cron: '15 13 26 * *' # 26th every month - 13:15 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: latest

jobs:
  build-iso:
    name: Build and upload ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Mount Container Storage BTRFS Loopback
        run: |
          sudo truncate -s 70G /mnt/podman-storage.img
          sudo mkfs.btrfs -f /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          sudo mount -o compress-force=zstd:2 /mnt/podman-storage.img /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Prepare environment
        run: |
          # Get UID/GID to use for chown in the builder
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}
          # Lowercase registry strings for container compatibility
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Generate flatpak list
        id: flatpak_list
        run: |
          FILE_LIST="$(mktemp)"
          curl -sSL "https://raw.githubusercontent.com/projectbluefin/common/main/system_files/bluefin/usr/share/ublue-os/homebrew/system-flatpaks.Brewfile" | \
            awk -F"['\"]" '/^flatpak/ {print $2}' > "${FILE_LIST}"
          # Opinionated packages
          cat >> "${FILE_LIST}" << 'EOF'
            im.pidgin.Pidgin
            org.qbittorrent.qBittorrent
            org.audacityteam.Audacity
            io.mpv.Mpv
            org.onlyoffice.desktopeditors
            org.chromium.Chromium
            org.kde.drawy
            org.kde.kget
            io.github.kovzol.geogebra-discovery
            org.gtkhash.gtkhash
            org.kde.kate
            org.keepassxc.KeePassXC
            org.kde.krita
            org.localsend.localsend_app
            org.bunkus.mkvtoolnix-gui
            org.videolan.VLC
          EOF
          echo "file_list_path=${FILE_LIST}" >> $GITHUB_OUTPUT

      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@840217d97bd0bc9a52466508c54d8dda5c5ba2fd # main
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          flatpaks-list: ${{ steps.flatpak_list.outputs.file_list_path }}
          hook-post-rootfs: ${{ github.workspace }}/iso/build_iso.sh

      - name: Prepare Staging Directory
        run: |
          mkdir -p upload_staging
          BASE_NAME="${IMAGE_NAME}-${IMAGE_TAG}-amd64"

          # 1. Copy and rename the generated ISO
          ISO_SRC="${{ steps.build.outputs['iso-dest'] }}"
          ISO_DEST="upload_staging/${BASE_NAME}.iso"
          cp "$ISO_SRC" "$ISO_DEST"

          # 2. Create the SHA256 Checksum file
          cd upload_staging
          sha256sum "${BASE_NAME}.iso" > "${BASE_NAME}.iso.sha256"
          cd ..

          # Export the staging directory path and base name
          echo "STAGING_DIR=upload_staging" >> "$GITHUB_ENV"
          echo "BASE_NAME=${BASE_NAME}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Sign ISO
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{secrets.COSIGN_PASSWORD}}
        run: |
          # Sign the ISO and output the signature to the staging directory so it gets uploaded to R2 automatically
          cosign sign-blob -y \
            --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY \
            $STAGING_DIR/${BASE_NAME}.iso \
            --output-signature $STAGING_DIR/${BASE_NAME}.iso.sig

      - name: Attest ISO
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: upload_staging/${{ env.BASE_NAME }}.iso

      - name: Upload ISO
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "::group:: Getting rclone"
          sudo apt-get update
          sudo apt-get install -y rclone
          echo "::endgroup::"

          echo "::group:: Uploading to R2..."
          rclone copy "$STAGING_DIR" "R2:$R2_BUCKET"
          echo "::endgroup::"
