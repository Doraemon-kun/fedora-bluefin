name: Build and Upload ISO

on:
  schedule:
    - cron: '15 13 26 * *' # 26th every month - 13:15 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: latest

jobs:
  build-iso:
    name: Build and upload ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Mount Container Storage BTRFS Loopback
        run: |
          sudo truncate -s 70G /mnt/podman-storage.img
          sudo mkfs.btrfs -f /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          sudo mount -o compress-force=zstd:2 /mnt/podman-storage.img /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prepare environment
        run: |
          # Get UID/GID to use for chown in the builder
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}
          # Lowercase registry strings for container compatibility
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build temporary ISO-ready image
        run: |
          IMAGE_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          # 1. Write the FROM line and ENV with variables injected
          echo "FROM $IMAGE_REF" > Containerfile.iso
          echo "ENV INSTALL_IMAGE_REF=$IMAGE_REF" >> Containerfile.iso

          # 2. Append the rest of the file EXACTLY as written
          cat <<'EOF' >> Containerfile.iso

          # Install all LiveCD, Installer, and Storage dependencies
          RUN dnf install -y \
              dracut-live \
              anaconda-live \
              libblockdev-btrfs \
              libblockdev-lvm \
              libblockdev-dm \
              livesys-scripts \
              xorriso \
              isomd5sum \
              grub2-efi-x64-cdboot \
              grub2-pc \
              podman \
              mokutil \
              jq

          # Mount /proc/sys rw for bwrap and pull the image directly into containers-storage
          RUN mount -o remount,rw /proc/sys && \
              podman pull ${INSTALL_IMAGE_REF}

          # Install the complete list of Bluefin Stable Flatpaks
          RUN curl --retry 3 -Lo /etc/flatpak/remotes.d/flathub.flatpakrepo https://dl.flathub.org/repo/flathub.flatpakrepo && \
              flatpak install -y --noninteractive flathub \
                  com.github.PintaProject.Pinta \
                  com.github.tchx84.Flatseal \
                  com.mattjakeman.ExtensionManager \
                  com.ranfdev.DistroShelf \
                  io.github.flattool.Ignition \
                  io.github.flattool.Warehouse \
                  io.github.kolunmi.Bazaar \
                  io.gitlab.adhami3310.Impression \
                  io.missioncenter.MissionCenter \
                  it.mijorus.smile \
                  org.gnome.Calculator \
                  org.gnome.Calendar \
                  org.gnome.Characters \
                  org.gnome.Connections \
                  org.gnome.Contacts \
                  org.gnome.DejaDup \
                  org.gnome.FileRoller \
                  org.gnome.Firmware \
                  org.gnome.Logs \
                  org.gnome.Loupe \
                  org.gnome.Maps \
                  org.gnome.NautilusPreviewer \
                  org.gnome.Papers \
                  org.gnome.Showtime \
                  org.gnome.SimpleScan \
                  org.gnome.Snapshot \
                  org.gnome.SoundRecorder \
                  org.gnome.TextEditor \
                  org.gnome.Weather \
                  org.gnome.baobab \
                  org.gnome.clocks \
                  org.gnome.font-viewer \
                  org.mozilla.Thunderbird \
                  org.mozilla.firefox \
                  page.tesk.Refine

          # Configure Anaconda & inject the SecureBoot Enrollment script
          RUN echo "ostreecontainer --url=${INSTALL_IMAGE_REF} --transport=containers-storage --no-signature-verification" > /usr/share/anaconda/interactive-defaults.ks && \
              echo "%post" >> /usr/share/anaconda/interactive-defaults.ks && \
              echo "bootc switch --mutate-in-place --transport registry ${INSTALL_IMAGE_REF}" >> /usr/share/anaconda/interactive-defaults.ks && \
              echo "mkdir -p /etc/pki/akmods/certs/" >> /usr/share/anaconda/interactive-defaults.ks && \
              echo "curl -Lo /etc/pki/akmods/certs/ublue_pubkey.der https://github.com/ublue-os/akmods/raw/main/certs/public_key.der" >> /usr/share/anaconda/interactive-defaults.ks && \
              echo "if [ -d '/sys/firmware/efi/efivars' ]; then" >> /usr/share/anaconda/interactive-defaults.ks && \
              echo "    printf 'ublue\nublue\n' | mokutil --import /etc/pki/akmods/certs/ublue_pubkey.der || true" >> /usr/share/anaconda/interactive-defaults.ks && \
              echo "fi" >> /usr/share/anaconda/interactive-defaults.ks && \
              echo "%end" >> /usr/share/anaconda/interactive-defaults.ks

          # Mount /var/lib/flatpak as readonly to prevent tainting during Live session
          RUN echo -e "[Mount]\nType=none\nWhat=/var/lib/flatpak\nWhere=/var/lib/flatpak\nOptions=bind,ro\n[Install]\nWantedBy=multi-user.target" > /etc/systemd/system/var-lib-flatpak.mount && \
              systemctl enable var-lib-flatpak.mount

          # Regenerate initramfs for LiveCD boot
          RUN kernel=$(kernel-install list --json pretty | jq -r '.[] | select(.has_kernel == true) | .version') && \
              DRACUT_NO_XATTR=1 dracut -v --force --zstd --reproducible --no-hostonly \
                  --add "dmsquash-live dmsquash-live-autooverlay" \
                  "/usr/lib/modules/${kernel}/initramfs.img" "${kernel}"

          # Stage EFI Binaries
          RUN mkdir -p /boot/efi && \
              cp -av /usr/lib/efi/*/*/EFI /boot/efi/ && \
              cp -v /boot/efi/EFI/fedora/grubx64.efi /boot/efi/EFI/BOOT/fbx64.efi

          # Configure Livesys to auto-login to GNOME Desktop
          RUN sed -i "s/^livesys_session=.*/livesys_session=gnome/" /etc/sysconfig/livesys && \
              systemctl enable livesys.service livesys-late.service

          # Expand /var/tmp in RAM so OSTree doesn't run out of space during installation
          RUN rm -rf /var/tmp || true && \
              mkdir -p /var/tmp && \
              echo -e "[Unit]\nDescription=Larger tmpfs for /var/tmp on live system\n[Mount]\nWhat=tmpfs\nWhere=/var/tmp\nType=tmpfs\nOptions=size=50%%,nr_inodes=1m,x-systemd.graceful-option=usrquota\n[Install]\nWantedBy=local-fs.target" > /etc/systemd/system/var-tmp.mount && \
              systemctl enable var-tmp.mount
          EOF

          # Build it into root's storage
          sudo podman build --cap-add sys_admin --security-opt label=disable -t local-image -f Containerfile.iso .

      - name: Build ISO
        id: build
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a # revamp-pr
        with:
          # Titanoboa only needs the image reference; configuration is pulled from inside the image
          image-ref: local-image

      - name: Prepare Staging Directory
        run: |
          mkdir -p upload_staging
          BASE_NAME="${IMAGE_NAME}-${IMAGE_TAG}-amd64"

          # 1. Copy and rename the generated ISO
          ISO_SRC="${{ steps.build.outputs['iso-dest'] }}"
          ISO_DEST="upload_staging/${BASE_NAME}.iso"
          cp "$ISO_SRC" "$ISO_DEST"

          # 2. Create the SHA256 Checksum file
          cd upload_staging
          sha256sum "${BASE_NAME}.iso" > "${BASE_NAME}.iso.sha256"
          cd ..

          # Export the staging directory path and base name
          echo "STAGING_DIR=upload_staging" >> "$GITHUB_ENV"
          echo "BASE_NAME=${BASE_NAME}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v2.6.1'

      - name: Sign ISO
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{secrets.COSIGN_PASSWORD}}
        run: |
          # Sign the ISO and output the signature to the staging directory so it gets uploaded to R2 automatically
          cosign sign-blob -y \
            --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY \
            $STAGING_DIR/${BASE_NAME}.iso \
            --output-signature $STAGING_DIR/${BASE_NAME}.iso.sig

      - name: Attest ISO
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: upload_staging/${{ env.BASE_NAME }}.iso

      - name: Upload ISO
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

          rclone copy "$STAGING_DIR" "R2:$R2_BUCKET"
