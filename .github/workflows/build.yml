---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '25 12 * * *'  # 12:25 UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "Fedora Bluefin"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,fedora-bluefin"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base_image: [bluefin, bluefin-dx]

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Prepare environment
        run: |
          echo "::group:: Rewrite some GitHub environment variables"
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          # Dynamically output fedora-bluefin and fedora-bluefin-dx based on matrix
          echo "IMAGE_NAME=fedora-${{ matrix.base_image }}" >> ${GITHUB_ENV}
          echo "::endgroup::"

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      # This will do nothing but just keep it there
      - name: Mount BTRFS for podman storage
        id: container-storage-action
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main

        # Fallback to the remove-unwanted-software-action if github doesn't allocate enough space
        # See: https://github.com/ublue-os/container-storage-action/pull/11
        continue-on-error: true 
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Calculate Daily Build Iteration
        id: iteration
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "DATE_PREFIX=$DATE" >> $GITHUB_ENV
          IMAGE_URL="docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"

          TAG_JSON=$(skopeo list-tags --creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} $IMAGE_URL || echo "{}")
          TAGS=$(echo "$TAG_JSON" | jq -r '.Tags[]?' || echo "")

          MATCHING_TAGS=$(echo "$TAGS" | grep -E "^${DATE}(\.[0-9]+)?$" || true)

          if [ -z "$MATCHING_TAGS" ]; then
              ITERATION=0
          else
              MAX_VAL=$(echo "$MATCHING_TAGS" | awk -F. '{if (NF==1) print 0; else print $2}' | sort -n | tail -1)
              ITERATION=$((MAX_VAL + 1))
          fi

          echo "BUILD_ITERATION=$ITERATION" >> $GITHUB_ENV

          if [ "$ITERATION" -eq 0 ]; then
            echo "DATE_TAG=$DATE" >> $GITHUB_ENV
          else
            echo "DATE_TAG=${DATE}.${ITERATION}" >> $GITHUB_ENV
          fi

          echo "Calculated Iteration: $ITERATION"

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.${{ env.DATE_PREFIX }}
            type=raw,value=${{ env.DATE_TAG }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        env:
          MOK_PRIVATE_KEY: ${{ secrets.MOK_PRIVATE_KEY }}
        run: |
          echo "::group:: Getting information on what build to build"
          # Read the multiline labels string into a bash array securely
          mapfile -t LABEL_ARRAY <<< "${{ steps.metadata.outputs.labels }}"

          # Construct the arguments array, preserving spaces!
          BUILD_ARGS=()
          for label in "${LABEL_ARRAY[@]}"; do
            if [ -n "$label" ]; then
              BUILD_ARGS+=("--label" "$label")
            fi
          done

          # Pass the matrix base image into Containerfile
          BUILD_ARGS+=("--build-arg" "BASE_IMAGE_NAME=${{ matrix.base_image }}")
          # And the iterations
          BUILD_ARGS+=("--build-arg" "BUILD_ITERATION=${{ env.BUILD_ITERATION }}")
          echo "::endgroup::"

          # Decode the base64 secret and write it directly to a file
          echo "$MOK_PRIVATE_KEY" | base64 -d > ./mok_private.key
          chmod 600 ./mok_private.key

          # Mount the physical file as a secret
          sudo podman build --squash "${BUILD_ARGS[@]}" \
            --secret id=mok_key,src=./mok_private.key \
            -t ${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} -f ./Containerfile .

          # Clean up the key file immediately
          rm -f ./mok_private.key

      # Tag for registry
      #- name: Tag for registry
      #  run: |
      #    for tag in ${{ steps.metadata.outputs.tags }}; do
      #      podman tag ${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} ${{ env.IMAGE_NAME }}:$tag
      #    done

      # SBOM: Software Bill of Materials generation using Syft
      # Creates a detailed inventory of all software components in the image for supply chain security.
      # To enable:
      #   1. Uncomment the "Setup Syft" step below
      #   2. Uncomment the "Generate SBOM" step below
      #   3. If using image signing, also uncomment the "Add SBOM Attestation" step further down
      # Documentation: https://github.com/anchore/syft
      
      - name: Setup Syft
        id: setup-syft
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.20.0

      - name: Generate SBOM
        id: generate-sbom
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          OUTPUT_PATH="$(mktemp -d)/sbom.json"
          export SYFT_PARALLELISM=$(($(nproc)*2))

          FLAT_DIR="/tmp/flat-rootfs"
          mkdir -p ${FLAT_DIR}

          # 1. Flatten the image to a standard directory (The Bluefin Secret)
          sudo podman container create --replace --name "sbom-container" ${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} bash
          sudo podman export "sbom-container" | sudo tar -C ${FLAT_DIR} -xf -
          sudo podman container rm "sbom-container"

          # 2. Point Syft at the native filesystem directory instead of OCI layers
          sudo $SYFT_CMD --source-name "${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" dir:${FLAT_DIR} -o spdx-json=${OUTPUT_PATH}

          # 3. Clean up the extracted filesystem to free space
          sudo rm -rf ${FLAT_DIR}

          # 4. Fix permissions so the non-root runner can read the file for the Attestation step
          sudo chown $(whoami):$(id -g) ${OUTPUT_PATH}

          du -sh ${OUTPUT_PATH}
          echo "OUTPUT_PATH=${OUTPUT_PATH}" >> $GITHUB_OUTPUT

      - name: Run Rechunker
        id: rechunk
        uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2
        with:
          ref: '${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}'
          prev-ref: '${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}'
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Fix OCI Directory Permissions
        run: |
          # The rechunker runs as root and outputs the OCI directory as root.
          # We must grant ownership back to the GitHub 'runner' user so Syft and Skopeo can read it.
          sudo chown -R $(whoami):$(id -g) ${{ steps.rechunk.outputs.location }}

          # And add read perm to all files, traverse to all directories
          sudo chmod -R a+rX ${{ steps.rechunk.outputs.location }}

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #- name: Push To GHCR
      #  uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
      #  if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      #  id: push
      #  env:
      #    REGISTRY_USER: ${{ github.actor }}
      #    REGISTRY_PASSWORD: ${{ github.token }}
      #  with:
      #    registry: ${{ env.IMAGE_REGISTRY }}
      #    image: ${{ env.IMAGE_NAME }}
      #    tags: ${{ steps.metadata.outputs.tags }}
      #    username: ${{ env.REGISTRY_USER }}
      #    password: ${{ env.REGISTRY_PASSWORD }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        run: |
          echo "::group:: Installing skopeo"
          IMAGE_URL="docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"

          OCI_SOURCE="${{ steps.rechunk.outputs.ref }}"

          sudo apt-get install skopeo
          echo "::endgroup::"
          echo "::group:: Uploading to GHCR..."
          # Skopeo securely copies the OCI directory straight to GitHub Container Registry
          for tag in ${{ steps.metadata.outputs.tags }}; do
            skopeo copy \
              --dest-creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} \
              "$OCI_SOURCE" \
              $IMAGE_URL:$tag
          done
          echo "::endgroup::"

          # Retrieve the registry digest of the pushed image so Cosign can sign it
          DIGEST=$(skopeo inspect --creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} $IMAGE_URL:${{ env.DEFAULT_TAG }} | jq -r .Digest)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # Image Signing with Cosign

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      #- name: Generate Cosign Signing Config
      #  if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      #  run: cosign signing-config create --with-default-services --no-default-rekor --out ${GITHUB_WORKSPACE}/signing-config.json

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          cosign sign -y --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{secrets.COSIGN_PASSWORD}}
          IMAGE_FULL: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}

      # SBOM Attestation
      # Attaches SBOM (Software Bill of Materials) to your signed image for supply chain security.
      # Requires image signing to be enabled first (see above).

      - name: Install ORAS
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Upload SBOM
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: upload-sbom
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: ${{ steps.generate-sbom.outputs.OUTPUT_PATH }}
        run: |
          # Login to ORAS so it can push to the registry
          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io -u ${{ github.actor }} --password-stdin

          cd "$(dirname "$SBOM")"
          # Attach the raw SPDX JSON file directly to the image in the registry
          oras attach \
            --artifact-type application/vnd.spdx+json \
            --annotation filename=$(basename "$SBOM") \
            "${IMAGE}@${DIGEST}" \
            "$(basename "$SBOM")"

          # Retrieve the digest of the uploaded SBOM artifact.
          # Multiple SPDX referrers may exist over time, so select exactly one digest.
          sbom_digest=$(oras discover --format json "${IMAGE}@${DIGEST}" | jq -er '[.referrers[] | select(.artifactType == "application/vnd.spdx+json") | .digest] | .[-1]')
          if [ -z "${sbom_digest}" ]; then
            echo "No SPDX SBOM referrer found for ${IMAGE}@${DIGEST}" >&2
            exit 1
          fi
          echo "sbom_digest=${sbom_digest}" >> $GITHUB_OUTPUT

      - name: Sign SBOM OCI Artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{secrets.COSIGN_PASSWORD}}
          IMAGE_FULL: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom_digest }}
        run: |
          cosign sign -y --tlog-upload=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_FULL}@${SBOM_DIGEST}

      - name: Add SBOM Attestation
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{secrets.COSIGN_PASSWORD}}
          SBOM_OUTPUT: ${{ steps.generate-sbom.outputs.OUTPUT_PATH }}
        run: |
          cd "$(dirname "$SBOM_OUTPUT")"
          cosign attest -y \
            --tlog-upload=false \
            --predicate "$(basename "$SBOM_OUTPUT")" \
            --type spdxjson \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: GitHub Native Attestation
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 #v4.1.0
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
